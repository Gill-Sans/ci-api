spring:
  application:
    name: capit-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/capit
server:
  port: 9001
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /docs/user-service/v3/api-docs
      - name: Interactions Service
        url: /docs/interactions-service/v3/api-docs
      - name: Schedule Service
        url: /docs/schedule-service/v3/api-docs
  api-docs:
    path: /api-docs
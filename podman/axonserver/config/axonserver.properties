# Axon Server configuration for local development
axonserver.admin.enabled=true
axonserver.context=default
axonserver.replication.group=default
axonserver.eventstore.default-read-batch-size=100
axonserver.eventstore.default-write-batch-size=50
axonserver.log.level=INFO
axonserver.cluster.enabled=false
axonserver.initialization.complete=true
# Kk8s-config-local.yaml

# ─────────────────────────────────────────────────────────────────────────────
# 1) Gateway
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capit-gateway
  labels:
    app: capit-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: capit-gateway
  template:
    metadata:
      labels:
        app: capit-gateway
    spec:
      hostNetwork: true
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: capit-gateway
          image: ghcr.io/gill-sans/ci-api/capit-gateway:latest
          ports:
            - containerPort: 9001
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://192.168.0.53:5432/interactions"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "password"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://192.168.0.53:8180/realms/capit"
---

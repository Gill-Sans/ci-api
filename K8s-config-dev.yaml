# K8s-config-local.yaml
# ─────────────────────────────────────────────────────────────────────────────
# 0) Service for Gateway
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: capit-gateway
  namespace: default
spec:
  selector:
    app: capit-gateway
  ports:
    - name: http
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: capit-schedule
spec:
  selector:
    app: capit-schedule
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: capit-interactions
spec:
  selector:
    app: capit-interactions
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: capit-users
spec:
  selector:
    app: capit-users
  ports:
    - port: 8080
      targetPort: 8080
---

# ─────────────────────────────────────────────────────────────────────────────
# 1) Gateway
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capit-gateway
  labels:
    app: capit-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: capit-gateway
  template:
    metadata:
      labels:
        app: capit-gateway
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: capit-gateway
          image: ghcr.io/gill-sans/ci-api/capit-gateway:latest
          ports:
            - containerPort: 9001
              hostPort: 9001
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://192.168.0.53:5432/interactions"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "password"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://192.168.0.53:8180/realms/capit"
---
# ─────────────────────────────────────────────────────────────────────────────
# 2) Users
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capit-users
  labels:
    app: capit-users
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: capit-users
  template:
    metadata:
      labels:
        app: capit-users
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: capit-users
          image: ghcr.io/gill-sans/ci-api/capit-users:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://192.168.0.53:5432/users"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "password"
---
# ─────────────────────────────────────────────────────────────────────────────
# 3) Interactions
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capit-interactions
  labels:
    app: capit-interactions
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: capit-interactions
  template:
    metadata:
      labels:
        app: capit-interactions
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: capit-interactions
          image: ghcr.io/gill-sans/ci-api/capit-interactions:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://192.168.0.53:5432/interactions"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "password"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "192.168.0.53:9092"
---
# ─────────────────────────────────────────────────────────────────────────────
# 4) Schedule
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capit-schedule
  labels:
    app: capit-schedule
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: capit-schedule
  template:
    metadata:
      labels:
        app: capit-schedule
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: capit-schedule
          image: ghcr.io/gill-sans/ci-api/capit-schedule:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://192.168.0.53:5432/schedules"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "password"
            - name: AXON_AXONSERVER_SERVERS
              value: "192.168.0.53:8124"
---
# ─────────────────────────────────────────────────────────────────────────────
# Ingress for Gateway
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capit-gateway
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: gateway.mertenshome.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: capit-gateway
                port:
                  number: 9001
